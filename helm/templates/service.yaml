apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.application_name }}-svc
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: 
    {{- toYaml .Values.labels | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      