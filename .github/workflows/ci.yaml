name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  application:
    name: Test application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

  helm:
    name: Validate Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint Helm chart
        run: helm lint ./helm

      - name: Render Helm chart
        run: |
          helm template devops-homework ./helm \
            --set image.repository=devops-homework \
            --set image.tag="${GITHUB_SHA}"

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

  container:
    name: Build container
    runs-on: ubuntu-latest
    needs:
      - application
      - helm
      - terraform
      
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare image metadata
        id: metadata
        shell: bash
        run: |
            image_repository="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
            image_tag="${GITHUB_SHA::12}"

            echo "repository=${image_repository}" >> "${GITHUB_OUTPUT}"
            echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and optionally publish container
        uses: docker/build-push-action@v7
        with:
            context: ./app
            file: ./app/Dockerfile
            push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            tags: ${{ steps.metadata.outputs.repository }}:${{ steps.metadata.outputs.tag }}
      - name: Add image information to summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "### Published container image" >> "${GITHUB_STEP_SUMMARY}"
          echo '```text' >> "${GITHUB_STEP_SUMMARY}"
          echo "${{ steps.metadata.outputs.repository }}:${{ steps.metadata.outputs.tag }}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"